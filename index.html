<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>McMinnville Dental Group | Led by Dr. Justin Walter</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/main.js" defer></script>
</head>
<body style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow-x:hidden;margin:0;display:flex;flex-direction:column;min-height:100vh">

  <!-- Header -->
  <header style="position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--color-bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--color-text) 5%,transparent)">
    <div style="max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,24px) 24px;display:flex;align-items:center;justify-content:space-between">
      <a href="#" style="display:block"><img src="uploads/McMinnville_Logo.png" alt="McMinnville Dental Group" style="height:clamp(46px,6vw,54px);width:auto"></a>
      <a href="tel:+15034722181" class="btn btn-primary" style="text-decoration:none;font-size:16px;padding:12px 24px">Call Us</a>
    </div>
  </header>

  <main style="flex:1;background:var(--color-accent-100)">
    <div class="bento-grid">
      
      <!-- Hero / Brand Card -->
      <div class="bento-card bento-hero" style="background:var(--color-bg);justify-content:center;align-items:center;text-align:center;gap:32px">
        
        <img src="uploads/emblem.png" alt="McMinnville Family Dental Emblem" style="width:clamp(100px, 15vw, 160px);height:auto;filter:drop-shadow(0 12px 24px rgba(47,62,133,0.15))">
        
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:1">
          <h1 style="font-size:clamp(32px,5vw,64px);line-height:1.1;margin:0;font-family:var(--font-heading);background:linear-gradient(135deg, var(--color-accent-900) 0%, var(--color-accent-500) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-wrap:balance">McMinnville Family Dental</h1>
          
          <div style="display:flex;align-items:center;gap:16px">
            <div style="height:2px;width:clamp(30px, 5vw, 60px);background:var(--color-accent-200);border-radius:2px"></div>
            <span style="font-family:var(--font-body);font-weight:700;font-size:clamp(16px, 2.5vw, 22px);color:var(--color-accent-700);text-transform:uppercase;letter-spacing:2px">Dr. Justin Walter</span>
            <div style="height:2px;width:clamp(30px, 5vw, 60px);background:var(--color-accent-200);border-radius:2px"></div>
          </div>
        </div>
      </div>

      <!-- Map Card -->
      <div class="bento-card bento-map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2797.778841253457!2d-123.19796032338902!3d45.22818787123992!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x549543e49e25d2e7%3A0xb35a0f5a706be22c!2s2550%20NE%20McDonald%20Ln%2C%20McMinnville%2C%20OR%2097128!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <!-- Contact & Location Card -->
      <div class="bento-card bento-contact">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--color-accent-100);color:var(--color-accent-700);display:flex;align-items:center;justify-content:center;margin-bottom:24px;font-size:24px">
          📍
        </div>
        <h3 style="margin:0 0 16px;font-size:22px;font-family:var(--font-heading)">Location & Contact</h3>
        <p style="font-size:18px;font-weight:600;line-height:1.5;margin:0 0 24px;color:var(--color-text)">2550 NE McDonald Ln<br>McMinnville, OR 97128</p>
        <a href="tel:+15034722181" style="font-size:28px;font-weight:700;color:var(--color-accent-700);text-decoration:none;margin-top:auto">503-472-2181</a>
      </div>

      <!-- Hours Card -->
      <div class="bento-card bento-hours">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--color-accent-100);color:var(--color-accent-700);display:flex;align-items:center;justify-content:center;margin-bottom:24px;font-size:24px">
          🕒
        </div>
        <h3 style="margin:0 0 16px;font-size:22px;font-family:var(--font-heading)">Hours</h3>
        <div style="margin-top:auto;width:100%;font-size:18px">
          <div style="display:flex;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 10%,transparent);margin-bottom:16px">
            <span style="font-weight:600">Mon - Fri</span>
            <span>8:00 AM – 4:00 PM</span>
          </div>
          <div style="display:flex;justify-content:space-between;opacity:0.5">
            <span style="font-weight:600">Sat - Sun</span>
            <span>Closed</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer style="background:var(--color-accent-900);color:var(--color-bg);padding:40px 24px;text-align:center">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px">
      <p style="font-size:14px;color:color-mix(in srgb,var(--color-bg) 60%,transparent);margin:0">© 2026 McMinnville Dental Group. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
